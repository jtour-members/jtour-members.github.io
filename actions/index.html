<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J-TOUR 主催者折衝｜論点・ネクストアクション</title>
<style>
  :root{
    --ink:#111111; --ink2:#3A3A3A; --label:#6B6B6B; --faint:#9B9B9B;
    --line:#E4E4E4; --line2:#EFEFEF; --bg:#F7F7F8; --card:#FFFFFF;
    --accent:#111111; --alert:#CC0000; --alertBg:#FCEFEF; --soft:#F2F2F3;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Meiryo UI","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    background:var(--bg); color:var(--ink); font-size:13px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  header{background:var(--ink); color:#fff; padding:22px 28px 20px}
  .hwrap{max-width:1320px; margin:0 auto; display:flex; align-items:flex-end;
         justify-content:space-between; gap:20px; flex-wrap:wrap}
  header h1{font-size:19px; font-weight:700; letter-spacing:.04em}
  header .sub{font-size:11px; color:#B8B8B8; margin-top:5px; letter-spacing:.02em}
  header .meta{font-size:11px; color:#B8B8B8; text-align:right; line-height:1.8}

  .wrap{max-width:1320px; margin:0 auto; padding:22px 28px 64px}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:1px; background:var(--line); border:1px solid var(--line);
        border-radius:6px; overflow:hidden; margin-bottom:20px}
  .kpi{background:var(--card); padding:15px 17px}
  .kpi .lab{font-size:11px; color:var(--label); letter-spacing:.03em}
  .kpi .val{font-size:27px; font-weight:700; line-height:1.25; margin-top:3px; letter-spacing:-.01em}
  .kpi .val span{font-size:12px; font-weight:400; color:var(--label); margin-left:3px}
  .kpi.alert .val{color:var(--alert)}

  .toolbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
  .tabs{display:flex; border:1px solid var(--ink); border-radius:5px; overflow:hidden}
  .tabs button{font:inherit; font-size:12px; padding:7px 15px; border:0; cursor:pointer;
               background:#fff; color:var(--ink); letter-spacing:.02em}
  .tabs button+button{border-left:1px solid var(--ink)}
  .tabs button.on{background:var(--ink); color:#fff}
  input[type=search], select{
    font:inherit; font-size:12px; padding:7px 11px; border:1px solid var(--line);
    border-radius:5px; background:#fff; color:var(--ink); min-width:150px}
  input[type=search]{min-width:270px}
  input[type=search]:focus, select:focus{outline:none; border-color:var(--ink)}
  .chk{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink2);
       padding:7px 11px; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer}
  .spacer{flex:1}
  .count{font-size:11px; color:var(--label)}

  /* 大会別カード */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:8px;
        padding:17px 19px 15px; display:flex; flex-direction:column}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .card h2{font-size:14px; font-weight:700; line-height:1.45; letter-spacing:.01em}
  .card .org{font-size:11px; color:var(--label); margin-top:3px}
  .badge{font-size:10px; padding:3px 8px; border-radius:99px; white-space:nowrap;
         letter-spacing:.04em; border:1px solid transparent}
  .badge.s1{background:var(--ink); color:#fff}
  .badge.s2{background:#fff; color:var(--ink2); border-color:var(--ink2)}
  .badge.s3{background:var(--alertBg); color:var(--alert); border-color:var(--alert)}
  .badge.s4{background:var(--soft); color:var(--faint); border-color:var(--line)}

  .metaline{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--label);
            margin-top:11px; padding-bottom:11px; border-bottom:1px solid var(--line2)}
  .metaline b{font-weight:700; color:var(--ink2)}

  .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:7px}
  .tag{font-size:10.5px; color:var(--ink2); background:var(--soft); border-radius:3px; padding:2px 7px}
  .tag.cat{background:#fff; border:1px solid var(--ink2); color:var(--ink)}

  .secttl{font-size:10px; color:var(--faint); letter-spacing:.12em; margin-top:13px}
  ul.acts{list-style:none; margin-top:7px; display:flex; flex-direction:column; gap:8px}
  ul.acts li{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; line-height:1.6}
  ul.acts li::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--ink);
                     margin-top:8px; flex:none}
  .owner{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.02em;
         border:1px solid var(--line); border-radius:3px; padding:1px 6px; margin-right:6px;
         white-space:nowrap; color:var(--ink2)}
  .owner.us{background:var(--ink); color:#fff; border-color:var(--ink)}
  .due{display:inline-block; font-size:10px; margin-left:6px; padding:1px 6px; border-radius:3px;
       background:var(--soft); color:var(--ink2); white-space:nowrap}
  .due.near{background:var(--alertBg); color:var(--alert)}
  .empty{font-size:12px; color:var(--faint); margin-top:8px}

  .cardfoot{margin-top:auto; padding-top:13px; display:flex; gap:14px; align-items:center}
  .link{font-size:11px; color:var(--ink2); border:0; background:none; cursor:pointer;
        padding:0; font-family:inherit; border-bottom:1px solid var(--line); letter-spacing:.02em}
  .link:hover{color:var(--ink); border-color:var(--ink)}

  /* テーブル */
  table{width:100%; border-collapse:collapse; background:var(--card);
        border:1px solid var(--line); border-radius:8px; overflow:hidden}
  thead th{font-size:11px; color:var(--label); text-align:left; font-weight:400;
           padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
           background:#FCFCFC; cursor:pointer; letter-spacing:.03em}
  thead th:hover{color:var(--ink)}
  tbody td{padding:12px 14px; border-bottom:1px solid var(--line2); vertical-align:top; font-size:12.5px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FBFBFB}
  td.nowrap{white-space:nowrap}
  td.tourn{font-weight:700; min-width:150px}

  /* タイムライン */
  .tl{display:flex; flex-direction:column; gap:0}
  .tlgroup{background:var(--card); border:1px solid var(--line); border-radius:8px;
           padding:15px 19px; margin-bottom:12px}
  .tlgroup h3{font-size:13px; letter-spacing:.03em; display:flex; align-items:center; gap:9px}
  .tlgroup h3 .n{font-size:11px; color:var(--label); font-weight:400}
  .tlgroup.urgent{border-color:var(--alert)}
  .tlgroup.urgent h3{color:var(--alert)}

  dialog{border:0; border-radius:10px; padding:0; max-width:820px; width:92%;
         box-shadow:0 18px 50px rgba(0,0,0,.22)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlghead{padding:19px 24px 15px; border-bottom:1px solid var(--line); display:flex;
           justify-content:space-between; align-items:flex-start; gap:14px; position:sticky; top:0; background:#fff}
  .dlghead h2{font-size:15px}
  .dlghead .org{font-size:11px; color:var(--label); margin-top:4px}
  .dlgbody{padding:19px 24px 26px; max-height:66vh; overflow:auto}
  .dlgbody pre{font-family:inherit; white-space:pre-wrap; word-break:break-word;
               font-size:12.5px; line-height:1.85; color:var(--ink2)}
  .closebtn{font:inherit; font-size:12px; border:1px solid var(--line); background:#fff;
            border-radius:5px; padding:5px 12px; cursor:pointer}
  .closebtn:hover{border-color:var(--ink)}

  .note{font-size:11px; color:var(--faint); margin-top:24px; line-height:1.9}
  .hide{display:none !important}
  [hidden]{display:none !important}

  /* パスコードゲート */
  .gate{position:fixed; inset:0; background:var(--ink); color:#fff; display:flex;
        align-items:center; justify-content:center; padding:24px; z-index:50}
  .gatebox{width:100%; max-width:400px; text-align:center}
  .gatebox .brand{font-size:26px; font-weight:700; letter-spacing:.1em}
  .gatebox .ttl{font-size:13px; color:#B8B8B8; margin-top:10px; letter-spacing:.06em}
  .gateform{display:flex; gap:8px; margin-top:22px}
  .gateform input{flex:1; font:inherit; font-size:13px; padding:10px 12px; border:1px solid #4A4A4A;
                  border-radius:5px; background:#1C1C1C; color:#fff; min-width:0}
  .gateform input:focus{outline:none; border-color:#fff}
  .gateform button{font:inherit; font-size:13px; padding:10px 20px; border:0; border-radius:5px;
                   background:#fff; color:var(--ink); cursor:pointer; font-weight:700}
  .gateerr{font-size:12px; color:#FF8A8A; margin-top:12px; min-height:18px}
  .gatenote{font-size:11px; color:#8A8A8A; margin-top:18px; line-height:1.9}
  .gatebox.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
                   75%{transform:translateX(7px)}}

  @media (max-width:720px){
    .wrap{padding:16px 14px 48px}
    header{padding:18px 16px}
    .cards{grid-template-columns:1fr}
    input[type=search]{min-width:100%}
  }
  @media print{
    body{background:#fff} header{background:#fff; color:#000; border-bottom:2px solid #000}
    header .sub, header .meta{color:#555}
    .toolbar,.cardfoot{display:none} .card{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gatebox" id="gatebox">
    <div class="brand">J-TOUR</div>
    <div class="ttl">主催者折衝｜論点・ネクストアクション（社内限定）</div>
    <form class="gateform" id="gateform">
      <input type="password" id="gateinput" placeholder="パスコードを入力" autocomplete="off" aria-label="パスコード">
      <button type="submit">開く</button>
    </form>
    <div class="gateerr" id="gateerr"></div>
    <div class="gatenote">パスコードは社内アナウンスをご確認ください。<br>
      主催者との協議内容を含みます。社外への転送はご遠慮ください。</div>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="hwrap">
    <div>
      <h1>J-TOUR｜主催者折衝 論点・ネクストアクション</h1>
      <div class="sub">前回議論のトピック／論点／ネクストアクションを大会別に一覧化</div>
    </div>
    <div class="meta">
      更新: <span id="gen"></span><br>
      出典: <span id="src"></span>（各シート最新の面談記録）
    </div>
  </div>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="tabs">
      <button data-view="cards" class="on">大会別</button>
      <button data-view="table">アクション一覧</button>
      <button data-view="timeline">期限別</button>
    </div>
    <input type="search" id="q" placeholder="大会名・主催者・アクション本文を検索">
    <select id="fstatus">
      <option value="">すべての状況</option>
      <option value="進行中">進行中（30日以内）</option>
      <option value="要フォロー">要フォロー（31〜90日）</option>
      <option value="停滞">停滞（90日超）</option>
      <option value="日付不明">日付不明</option>
    </select>
    <select id="fowner">
      <option value="">担当すべて</option>
      <option value="us">当方（J-TOUR / NSSK / JGTO）</option>
      <option value="them">先方</option>
    </select>
    <select id="ftag"><option value="">論点カテゴリすべて</option></select>
    <label class="chk"><input type="checkbox" id="fdue"> 期限が明記されたものだけ</label>
    <div class="spacer"></div>
    <div class="count" id="count"></div>
  </div>

  <div id="view-cards"></div>
  <div id="view-table" class="hide"></div>
  <div id="view-timeline" class="hide"></div>

  <div class="note" id="note"></div>
</div>

<dialog id="dlg">
  <div class="dlghead">
    <div><h2 id="dlgTitle"></h2><div class="org" id="dlgMeta"></div></div>
    <button class="closebtn" onclick="document.getElementById('dlg').close()">閉じる</button>
  </div>
  <div class="dlgbody"><pre id="dlgBody"></pre></div>
</dialog>
</div>

let DATA = {generated_at:"", source:"", records:[]};
let ALL = [];
let NOW = new Date();
const US = /(j-?tour|jgto|nssk|当方|双方|両者|永尾|根岸|三枝|望月|齋藤)/i;
const STATUS_CLASS = {"進行中":"s1","要フォロー":"s2","停滞":"s3","日付不明":"s4"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dueMonth(s){
  if(!s) return null;
  const m = s.match(/(\d{1,2})月/) || s.match(/^(\d{1,2})\//);
  return m ? parseInt(m[1],10) : null;
}
function isNear(s){
  const m = dueMonth(s);
  if(m === null) return /今週|来週|今月|月内|次回|GW/.test(s);
  const cur = NOW.getMonth()+1;
  return m === cur || m === (cur % 12) + 1;
}
const isUs = o => US.test(o || "");

function passes(r, a){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const st = document.getElementById("fstatus").value;
  const ow = document.getElementById("fowner").value;
  const tg = document.getElementById("ftag").value;
  const dueOnly = document.getElementById("fdue").checked;
  if(st && r.status !== st) return false;
  if(tg && !(r.tags || []).includes(tg)) return false;
  if(a){
    if(ow === "us" && !isUs(a.owner)) return false;
    if(ow === "them" && (isUs(a.owner) || !a.owner)) return false;
    if(dueOnly && !a.deadline) return false;
    if(q && !(r.title+r.organizer+a.text+a.owner).toLowerCase().includes(q)) return false;
  }else{
    if(q && !(r.title+r.organizer+r.topics.join("")+(r.tags||[]).join("")
             +r.actions.map(x=>x.text+x.owner).join("")).toLowerCase().includes(q)) return false;
  }
  return true;
}

function actionLi(a){
  const cls = isUs(a.owner) ? "owner us" : "owner";
  return `<li><span>${a.owner ? `<span class="${cls}">${esc(a.owner)}</span>` : ""}${esc(a.text)}`
       + `${a.deadline ? `<span class="due${isNear(a.deadline)?" near":""}">〜${esc(a.deadline)}</span>` : ""}`
       + `${a.source === "次回論点" ? `<span class="due">次回論点欄より</span>` : ""}</span></li>`;
}

function renderCards(){
  const el = document.getElementById("view-cards");
  const ow = document.getElementById("fowner").value;
  const dueOnly = document.getElementById("fdue").checked;
  let shown = 0;
  const html = DATA.records.map(r => {
    if(!passes(r, null)) return "";
    let acts = r.actions.filter(a => {
      if(ow === "us" && !isUs(a.owner)) return false;
      if(ow === "them" && (isUs(a.owner) || !a.owner)) return false;
      if(dueOnly && !a.deadline) return false;
      return true;
    });
    if((ow || dueOnly) && !acts.length) return "";
    shown++;
    const days = r.days_since === null ? "" : `<span><b>${r.days_since}</b>日経過</span>`;
    return `<div class="card">
      <div class="top">
        <div><h2>${esc(r.title)}</h2><div class="org">${esc(r.organizer || r.sheet)}</div></div>
        <span class="badge ${STATUS_CLASS[r.status]}">${esc(r.status)}</span>
      </div>
      <div class="metaline">
        <span>前回 <b>${esc(r.latest_date || r.latest_date_raw || "記録なし")}</b></span>
        ${days}<span>面談 <b>${r.meeting_count}</b>回</span>
        ${r.place ? `<span>${esc(r.place)}</span>` : ""}
      </div>
      ${(r.tags||[]).length ? `<div class="tags" style="margin-top:11px">
        ${r.tags.map(t=>`<span class="tag cat">${esc(t)}</span>`).join("")}</div>` : ""}
      ${r.topics.length ? `<div class="secttl">前回の議論トピック</div>
        <div class="tags">${r.topics.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      <div class="secttl">ネクストアクション</div>
      ${acts.length ? `<ul class="acts">${acts.map(actionLi).join("")}</ul>`
                    : `<div class="empty">最新の議事録に記載なし。次回論点欄も未記入。</div>`}
      <div class="cardfoot">
        ${r.latest_body ? `<button class="link" data-sheet="${esc(r.sheet)}">前回議事録の全文</button>` : ""}
        ${r.next_meeting ? `<span class="count">次回予定: ${esc(r.next_meeting)}</span>` : ""}
      </div>
    </div>`;
  }).join("");
  el.innerHTML = `<div class="cards">${html}</div>`;
  return shown;
}

let sortKey = "date", sortAsc = false;
const SORTERS = {
  date: a => a.rec.latest_date || "",
  title: a => a.rec.title,
  owner: a => a.owner || "んん",
  due: a => a.deadline ? String(dueMonth(a.deadline) ?? 98).padStart(2,"0")+a.deadline : "99",
};

function renderTable(){
  const rows = ALL.filter(a => passes(a.rec, a));
  const f = SORTERS[sortKey];
  const sorted = rows.slice().sort((x,y) =>
    String(f(x)).localeCompare(String(f(y)), "ja") * (sortAsc ? 1 : -1));
  const arrow = k => k === sortKey ? (sortAsc ? " ↑" : " ↓") : "";
  document.getElementById("view-table").innerHTML = `<table>
    <thead><tr>
      <th data-k="date">前回面談日${arrow("date")}</th><th data-k="title">大会・折衝先${arrow("title")}</th>
      <th data-k="owner">担当${arrow("owner")}</th><th>ネクストアクション</th>
      <th data-k="due">期限${arrow("due")}</th>
    </tr></thead>
    <tbody>${sorted.map(a => `<tr>
      <td class="nowrap">${esc(a.rec.latest_date || a.rec.latest_date_raw || "-")}</td>
      <td class="tourn">${esc(a.rec.title)}</td>
      <td class="nowrap">${a.owner ? `<span class="${isUs(a.owner)?"owner us":"owner"}">${esc(a.owner)}</span>` : `<span class="count">未指定</span>`}</td>
      <td>${esc(a.text)}</td>
      <td class="nowrap">${a.deadline ? `<span class="due${isNear(a.deadline)?" near":""}">${esc(a.deadline)}</span>` : `<span class="count">-</span>`}</td>
    </tr>`).join("")}</tbody></table>`;
  return rows.length;
}

function renderTimeline(){
  const rows = ALL.filter(a => passes(a.rec, a));
  const groups = new Map();
  rows.forEach(a => {
    const key = a.deadline ? (isNear(a.deadline) ? "直近（今月〜来月）" : "先の期限") : "期限の記載なし";
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  });
  const order = ["直近（今月〜来月）","先の期限","期限の記載なし"];
  document.getElementById("view-timeline").innerHTML = order.filter(k=>groups.has(k)).map(k => {
    const list = groups.get(k).slice().sort((x,y) => (dueMonth(x.deadline)||99)-(dueMonth(y.deadline)||99));
    return `<div class="tlgroup${k.startsWith("直近")?" urgent":""}">
      <h3>${esc(k)} <span class="n">${list.length}件</span></h3>
      <ul class="acts">${list.map(a => `<li><span>
        <span class="owner${isUs(a.owner)?" us":""}">${esc(a.owner || "未指定")}</span>
        <b>${esc(a.rec.title)}</b>｜${esc(a.text)}
        ${a.deadline ? `<span class="due${isNear(a.deadline)?" near":""}">〜${esc(a.deadline)}</span>` : ""}
      </span></li>`).join("")}</ul></div>`;
  }).join("") || `<div class="tlgroup"><h3>該当なし</h3></div>`;
  return rows.length;
}

function renderKpis(){
  const withAction = DATA.records.filter(r => r.actions.length).length;
  const due = ALL.filter(a => a.deadline).length;
  const near = ALL.filter(a => a.deadline && isNear(a.deadline)).length;
  const stale = DATA.records.filter(r => r.status === "停滞" || r.status === "日付不明").length;
  const usCount = ALL.filter(a => isUs(a.owner)).length;
  const kpis = [
    ["折衝先", DATA.records.length, "件"],
    ["ネクストアクション", ALL.length, "件"],
    ["うち当方タスク", usCount, "件"],
    ["期限が明記", due, "件"],
    ["直近期限（今月〜来月）", near, "件", true],
    ["アクション未設定", DATA.records.length - withAction, "件"],
    ["停滞・日付不明", stale, "件", true],
  ];
  document.getElementById("kpis").innerHTML = kpis.map(([l,v,u,al]) =>
    `<div class="kpi${al && v ? " alert" : ""}"><div class="lab">${l}</div><div class="val">${v}<span>${u}</span></div></div>`
  ).join("");
}

let view = "cards";
function render(){
  ["cards","table","timeline"].forEach(v =>
    document.getElementById("view-"+v).classList.toggle("hide", v !== view));
  const n = view === "cards" ? renderCards() : view === "table" ? renderTable() : renderTimeline();
  document.getElementById("count").textContent =
    view === "cards" ? `${n} / ${DATA.records.length} 折衝先を表示` : `${n} / ${ALL.length} アクションを表示`;
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); view = b.dataset.view; render();
});
["q","fstatus","fowner","ftag","fdue"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));

document.addEventListener("click", e => {
  const th = e.target.closest("th[data-k]");
  if(th){
    if(sortKey === th.dataset.k) sortAsc = !sortAsc;
    else { sortKey = th.dataset.k; sortAsc = sortKey !== "date"; }
    render();
    return;
  }
  const b = e.target.closest("button[data-sheet]");
  if(!b) return;
  const r = DATA.records.find(x => x.sheet === b.dataset.sheet);
  document.getElementById("dlgTitle").textContent = r.title;
  document.getElementById("dlgMeta").textContent =
    `${r.latest_date || r.latest_date_raw}｜先方: ${r.their_side || "-"}／当方: ${r.our_side || "-"}｜${r.place || "-"}`;
  document.getElementById("dlgBody").textContent = r.latest_body;
  document.getElementById("dlg").showModal();
});

/* ---- 起動 / パスコードゲート ---- */
const gate = document.getElementById("gate");
const app = document.getElementById("app");
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pass){
  if(!(window.crypto && crypto.subtle)) throw new Error("no-webcrypto");
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(PAYLOAD.salt), iterations:300000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function initApp(data){
  DATA = data;
  NOW = new Date((DATA.generated_at || "").replace(/-/g,"/") || Date.now());
  ALL = [];
  DATA.records.forEach(r => r.actions.forEach((a,i) => ALL.push({...a, rec:r, key:r.sheet+"#"+i})));

  const tagSel = document.getElementById("ftag");
  [...new Set(DATA.records.flatMap(r => r.tags || []))].sort().forEach(t => {
    const o = document.createElement("option"); o.value = o.textContent = t; tagSel.appendChild(o);
  });
  document.getElementById("gen").textContent = DATA.generated_at;
  document.getElementById("src").textContent = DATA.source;
  document.getElementById("note").innerHTML =
    "状況の定義: 前回面談日からの経過日数で自動判定（進行中=30日以内／要フォロー=31〜90日／停滞=90日超）。<br>"
    + "ネクストアクションは各シート最新の面談記録から「今後の対応事項」「ネクストステップ」の項目を機械抽出したもの。記載がない場合はシート上部の「次回論点」欄を代用し、その旨を表示している。<br>"
    + "元シート由来の既知の重複: 「バンテリン東海クラシック」と「東海テレビ」は同一の議事録が別シートに登録されている。";
  renderKpis(); render();
  gate.hidden = true;
  app.hidden = false;
}

async function tryPass(pass, silent){
  if(!pass) return false;
  try{
    initApp(await decrypt(pass));
    sessionStorage.setItem("jt_actions_pass", pass);
    return true;
  }catch(e){
    if(!silent){
      document.getElementById("gateerr").textContent = e.message === "no-webcrypto"
        ? "このブラウザ環境では開けません（HTTPSでアクセスしてください）"
        : "パスコードが違います";
      const box = document.getElementById("gatebox");
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
    }
    return false;
  }
}

if(PAYLOAD.mode === "plain"){
  initApp(PAYLOAD.data);
}else{
  document.getElementById("gateform").addEventListener("submit", e => {
    e.preventDefault();
    tryPass(document.getElementById("gateinput").value.trim(), false);
  });
  const showGate = () => { gate.hidden = false; document.getElementById("gateinput").focus(); };
  const hashKey = (location.hash.match(/[#&]k=([^&]+)/) || [])[1];
  const auto = hashKey ? decodeURIComponent(hashKey) : sessionStorage.getItem("jt_actions_pass");
  if(auto) tryPass(auto, true).then(ok => { if(!ok) showGate(); });
  else showGate();
}
</script>
